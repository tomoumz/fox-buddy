<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Fox Buddy</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; user-select: none; -webkit-user-select: none; }
  canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; }

  .bubble { position: absolute; max-width: 260px; padding: 8px 11px; background: #fffaf0; color: #2b1b17;
    font-size: 12px; line-height: 1.45; font-weight: 600; letter-spacing: .2px;
    box-shadow: 0 -3px 0 #2b1b17, 0 3px 0 #2b1b17, -3px 0 0 #2b1b17, 3px 0 0 #2b1b17, 0 6px 0 rgba(0,0,0,.18);
    transform: translateX(-50%); transition: opacity .2s; pointer-events: auto; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -12px; width: 6px; height: 6px; background: #2b1b17;
    box-shadow: 0 -3px 0 #fffaf0, 3px -3px 0 #2b1b17, -3px -3px 0 #2b1b17; }
  .bubble.menu { max-width: 420px; }
  .bubble.menu .btns { gap: 5px; }
  .bubble.menu button { padding: 4px 7px; }
  .bubble .who { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; color: #b5511b; margin-bottom: 2px; }
  .bubble .btns { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .bubble button { font: inherit; font-size: 11px; cursor: pointer; border: 0; padding: 4px 8px; background: #ec7a2c; color: #fff;
    box-shadow: 0 2px 0 #b5511b; }
  .bubble button:hover { background: #f59a4a; }
  .bubble button:active { transform: translateY(2px); box-shadow: none; }

  #chat { position: absolute; display: none; transform: translateX(-50%); pointer-events: auto; }
  #chat input { width: 240px; font: inherit; font-size: 12px; padding: 7px 9px; border: 0; outline: 0; background: #fffaf0; color: #2b1b17;
    box-shadow: 0 -3px 0 #2ec4b6, 0 3px 0 #2ec4b6, -3px 0 0 #2ec4b6, 3px 0 0 #2ec4b6; }
  #chat small { display: block; text-align: center; color: #fff; font-size: 9px; margin-top: 6px; text-shadow: 0 1px 2px #000; }

  #keybox { position: absolute; display: none; transform: translateX(-50%); pointer-events: auto; }
  #keybox input { width: 280px; font: inherit; font-size: 12px; padding: 7px 9px; border: 0; outline: 0; background: #fffaf0; color: #2b1b17;
    box-shadow: 0 -3px 0 #ffc408, 0 3px 0 #ffc408, -3px 0 0 #ffc408, 3px 0 0 #ffc408; }
  #keybox small { display: block; text-align: center; color: #fff; font-size: 9px; margin-top: 6px; text-shadow: 0 1px 2px #000; }
  #hud { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: none; color: #fff; font-size: 13px; font-weight: 800;
    letter-spacing: 2px; text-shadow: 2px 2px 0 #2b1b17, -1px -1px 0 #2b1b17; white-space: pre; pointer-events: none; text-align: center; }
  #hud .hi { color: #ffd23f; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="bubbles"></div>
  <div id="chat"><input id="chatInput" maxlength="300" placeholder="say something to your fox…" autocomplete="off"><small>enter to send · esc to close</small></div>
  <div id="keybox"><input id="keyInput" type="password" placeholder="paste your key: sk-ant-…" autocomplete="off" spellcheck="false"><small>enter to save · esc to cancel · stored encrypted on this Mac</small></div>
  <div id="hud"></div>
  <script src="sprites.js"></script>
  <script src="lines.js"></script>
  <script src="app.js"></script>
</body>
</html>
